<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090e"><link rel="manifest" href="/static/manifest.webmanifest?v=4"><link rel="apple-touch-icon" href="/static/vibeprompt-v-192.png?v=4"><link rel="icon" type="image/png" sizes="192x192" href="/static/vibeprompt-v-192.png?v=4"><title>VibePrompt AI — кіру</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@800&amp;subset=cyrillic,cyrillic-ext&amp;display=swap"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07090e;color:#f5f7ff;font:16px 'Inter',system-ui,sans-serif}.box{width:min(340px,calc(100% - 64px));padding:28px;border:1px solid #30354b;border-radius:20px;background:#111521}.brand{font-family:'Manrope','Inter',system-ui,sans-serif;font-size:25px;font-weight:800}.brand span{color:#aaa8ff}p{color:#b4bdcf;line-height:1.6}input,button{box-sizing:border-box;width:100%;font:inherit;border-radius:10px;padding:14px}input{background:#090c13;color:white;border:1px solid #41475c}button{margin-top:14px;background:#7775f3;color:white;border:0;font-weight:700}.error{color:#ffaaaa}</style></head><body><form method="post" class="box"><div class="brand"><img src="/static/vibeprompt-v.svg?v=4" alt="" width="38" height="38" style="vertical-align:middle;border-radius:22%;margin-right:8px">VibePrompt <span>AI</span></div><p>Қосымшаға кіру үшін өз құпиясөзіңізді енгізіңіз. Осы құрылғыдағы кіру 30 күнге дейін сақталады.</p><label for="password">Құпиясөз</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button type="submit">Кіру</button></form></body></html>
